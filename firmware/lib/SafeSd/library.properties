name=SafeSd
version=1.0.0
sentence=Thread-safe SdFat wrapper for dual-core RP2040.
paragraph=Provides SafeSdFs and SafeSdFile. SafeSdFile wraps FsFile with per-call recursive mutex locking. SafeSdFs::with()/tryWith() acquire the same recursive mutex for atomic multi-step operations. Because the mutex is recursive, SafeSdFile calls inside a with() callback re-enter for free, making the whole callback atomic without extra locking.
category=Data Storage
architectures=rp2040
